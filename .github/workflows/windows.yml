name: Windows

# Compila o Liftstream para Windows numa máquina Windows do GitHub, prova a cópia sem o MSYS2 e, quando há um release,
# anexa o Liftstream-Windows.zip a ele. O release do Mac (./publicar.sh) dispara isto sozinho.
#
# Dois trabalhos: "uxplay" é o pesado (MSYS2: compila o UxPlay e junta as DLLs, uns 8 minutos) e guarda as pastas como
# artefato; "windows" compila a janela em C#, prova e empacota. Para ajustar só a prova ou a janela, rode com
# reaproveitar=<número de uma execução anterior> e o trabalho pesado é pulado.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release que recebe o zip (por exemplo v1.0.1). Vazio: só compila e prova, sem publicar."
        required: false
        default: ""
      reaproveitar:
        description: "Número de uma execução anterior cujas pastas (UxPlay e DLLs) serão reaproveitadas. Vazio: compila tudo."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  uxplay:
    if: ${{ inputs.reaproveitar == '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Compilar o UxPlay
        shell: msys2 {0}
        run: |
          # A mesma versão do Mac: UXPLAY_COMMIT fixa o código-fonte que o AVISOS-DE-TERCEIROS aponta.
          mkdir uxplay-src && cd uxplay-src
          git init -q
          git fetch -q --depth 1 https://github.com/FDH2/UxPlay.git "$(tr -d '\r\n' < ../UXPLAY_COMMIT)"
          git checkout -q FETCH_HEAD
          mkdir build && cd build
          # Sem NO_MARCH_NATIVE o UxPlay compila para o processador da máquina que o construiu, e em PC mais antigo ele
          # fecha com "instrução ilegal" (0xC000001D). Já aconteceu: o teste rodou noutra máquina do GitHub.
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DNO_MARCH_NATIVE=ON | tee cmake.log
          grep -q "Not using -march=native" cmake.log || { echo "o UxPlay está sendo compilado com -march=native"; exit 1; }
          ninja
          ls -la uxplay.exe

      - name: Montar as pastas (envio e teste)
        shell: msys2 {0}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          RAIZ="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd "$RAIZ"
          windows/empacotar-msys2.sh "$RAIZ/dist/Liftstream" "$RAIZ/uxplay-src/build/uxplay.exe"
          windows/empacotar-msys2.sh "$RAIZ/dist/teste" "$RAIZ/uxplay-src/build/uxplay.exe" teste

      - uses: actions/upload-artifact@v4
        with:
          name: pastas
          path: dist/
          compression-level: 3

  windows:
    needs: uxplay
    if: ${{ !cancelled() && (needs.uxplay.result == 'success' || needs.uxplay.result == 'skipped') }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $plist = Get-Content Info.plist -Raw
          $doPlist = [regex]::Match($plist, 'CFBundleShortVersionString</key>\s*<string>([^<]+)</string>').Groups[1].Value
          $versao = if ($env:TAG) { $env:TAG.TrimStart('v') } else { $doPlist }
          "versao=$versao" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $versao (release: '$env:TAG')"

      - uses: actions/download-artifact@v4
        with:
          name: pastas
          path: dist
          run-id: ${{ inputs.reaproveitar || github.run_id }}
          github-token: ${{ github.token }}

      - name: Compilar a janela (C#)
        shell: pwsh
        run: |
          dotnet build windows/Liftstream.csproj -c Release -p:Version=${{ steps.versao.outputs.versao }} -o windows/saida
          Copy-Item windows/saida/Liftstream.exe dist/Liftstream/
          Copy-Item windows/saida/Liftstream.exe dist/teste/
          Get-ChildItem dist/Liftstream | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host "$($_.Count) arquivos na raiz, $([math]::Round($_.Sum / 1MB)) MB" }

      - name: Provar sem o MSYS2
        shell: pwsh
        run: |
          # Como num PC qualquer: o MSYS2 sai do caminho e o PATH do teste só tem o Windows e a pasta do app.
          foreach ($d in @('C:\msys64')) {
            if (Test-Path $d) {
              try { Rename-Item $d ($d + '-oculto') -ErrorAction Stop; Write-Host "MSYS2 escondido: $d" }
              catch { Write-Host "não deu para esconder $d ($($_.Exception.Message)); o PATH do teste já o exclui" }
            }
          }
          ./windows/provar.ps1 -Pasta "$PWD\dist\teste" -Saida "$PWD\provas"

      - name: Guardar imagens e registros da prova
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provas-windows
          path: provas/
          if-no-files-found: ignore

      - name: Zip
        shell: pwsh
        run: |
          7z a -tzip Liftstream-Windows.zip ./dist/Liftstream | Select-Object -Last 4
          Get-Item Liftstream-Windows.zip | ForEach-Object { Write-Host "Liftstream-Windows.zip: $([math]::Round($_.Length / 1MB)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: Liftstream-Windows
          path: Liftstream-Windows.zip

      - name: Anexar ao release
        if: ${{ env.TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG Liftstream-Windows.zip --clobber
